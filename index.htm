<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
   
    <title>Arborithms</title>
</head>

<body>
    <!-- Global toggle button top-left -->
    <button class="global-toggle-btn" onclick="toggleAllCards()">
        <span class="btn-icon">📋</span> Toggle All
    </button>

    <div id="buttons">
        <!-- Left Tree Controls -->
        <div class="control-card" id="leftCard">
            <div class="card-header">
                <div class="card-title">🌳 Left Parent</div>
                <button class="toggle-btn" onclick="toggleCard('leftCard')"></button>
            </div>
            <div class="control-content">
                <div class="control-group">
                    <input id="whichLeft" list="varietiesLeft" placeholder="Select variety...">
                    <div class="control-row">
                        <button class="btn-load" onclick="loadInParentSlot(2)">📥 Load</button>
                        <button class="btn-mutate" onclick="mutate(set2)">🧬 Mutate</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Breeding Controls -->
        <div class="control-card" id="breedingCard">
            <div class="card-header">
                <div class="card-title">🔬 Breeding Lab</div>
                <button class="toggle-btn" onclick="toggleCard('breedingCard')"></button>
            </div>
            <div class="control-content">
                <div class="control-group">
                    <div class="control-row">
                        <button onclick="loadLeft()">⬅️ Use Child</button>
                        <button class="btn-copulate" onclick="copulate12()">💜 Copulate</button>
                        <button onclick="loadRight()">Use Child ➡️</button>
                    </div>
                    <button onclick="generateChild()">🔄 Regrow Trees</button>
                </div>
            </div>
        </div>

        <!-- Right Tree Controls -->
        <div class="control-card" id="rightCard">
            <div class="card-header">
                <div class="card-title">🌲 Right Parent</div>
                <button class="toggle-btn" onclick="toggleCard('rightCard')"></button>
            </div>
            <div class="control-content">
                <div class="control-group">
                    <input id="whichRight" list="varietiesRight" placeholder="Select variety...">
                    <div class="control-row">
                        <button class="btn-mutate" onclick="mutate(set1)">🧬 Mutate</button>
                        <button class="btn-load" onclick="loadInParentSlot(1)">📥 Load</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Save Controls - Positioned top-right -->
    <div class="control-card save-card" id="saveCard">
        <div class="card-header">
            <div class="card-title">💾 Save Tree</div>
            <button class="toggle-btn" onclick="toggleCard('saveCard')"></button>
        </div>
        <div class="control-content">
            <div class="control-group">
                <input id="treeName" type="text" placeholder="Enter tree name...">
                <select id="treeToSave">
                    <option value="1">🌲 Right Parent</option>
                    <option value="2">🌳 Left Parent</option>
                    <option value="3">🌱 Child</option>
                </select>
                <button class="btn-save" onclick="jsondump()">💾 Save to JSON</button>
            </div>
        </div>
    </div>
<br>

        
    <div id="bg">    
    </div>
    <canvas class="canvas" id="canvas"></canvas>
    <canvas class="canvas" id="particleCanvas" ></canvas>
    <script src="color.js"></script>
    <script src="canvas.js"></script>
    <h1 id="titleText">Arborithms !</h1>
</body>

</html>
